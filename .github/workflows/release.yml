name: Release

# Push a tag like v0.1.0 to build every platform's binary and attach them to a
# GitHub release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test
      - name: Check the tag matches package.json
        run: test "v$(jq -r .version package.json)" = "$GITHUB_REF_NAME"
      # Bun cross-compiles, so one runner builds all five.
      - run: bun run build:all
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
